name: Nightly

# The slow checks, off the merge path (operator 2026-11-18: "make some of
# these tests run on a daily cron and we fix them retroactively"): ASan +
# UBSan over the whole suite and the libFuzzer targets, every night on
# master and by hand. A red run becomes a ledger entry, fixed afterwards.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ASan + UBSan over the whole suite (scripts/sanitize.sh says why each
  # option is set). Any sanitizer report fails the job.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        variant: [full, lite]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zstd (Codex's .jsonl.zst rollouts, #656)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install zstd
          else
            sudo apt-get update -q && sudo apt-get install -y -q libzstd-dev
          fi
      - name: Build and test under ASan + UBSan
        run: |
          if [ "${{ matrix.variant }}" = "lite" ]; then
            scripts/sanitize.sh --without-libghostty
          else
            scripts/sanitize.sh
          fi

  # libFuzzer targets (tests/fuzz/), 60 s each under ASan + UBSan.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zstd (Codex's .jsonl.zst rollouts, #656)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install zstd
          else
            sudo apt-get update -q && sudo apt-get install -y -q libzstd-dev
          fi
      - name: Fuzz
        run: CC=clang FUZZ_ARTIFACTS=$PWD/fuzz-artifacts scripts/fuzz.sh 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14
