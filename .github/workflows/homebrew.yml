name: Update Homebrew tap

# Publishes/updates Formula/dch.rb and Formula/dch-lite.rb in
# ventsislav-georgiev/homebrew-tap. Called by release-assets.yml once the
# release's bottles are attached; dispatch it by hand to re-render a tag.
# Each formula carries a bottle block for the bottles the release has, and
# builds from source where none fits. Requires the HOMEBREW_TAP_TOKEN secret
# (a PAT with write access to the tap repo).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.10)"
        required: true

permissions:
  contents: read

jobs:
  bump-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tag="$TAG"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Compute source tarball sha256
        id: sha
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
          curl -fsSL "$url" -o src.tar.gz
          echo "sha256=$(sha256sum src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # brew fetches ROOT_URL/NAME-VERSION.TAG.bottle.tar.gz (one dash) for a
      # root_url that is not ghcr.io. A tag the release lacks gets no line.
      - name: Bottle blocks
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          root="https://github.com/${REPO}/releases/download/${TAG}"
          for f in dch dch-lite; do
            : > "sha-$f"
            for t in arm64_sonoma sonoma arm64_linux x86_64_linux; do
              if curl -fsSL --retry 3 "$root/$f-$VERSION.$t.bottle.tar.gz" -o bottle.tar.gz; then
                printf '    sha256 cellar: :any_skip_relocation, %s: "%s"\n' \
                  "$t" "$(sha256sum bottle.tar.gz | cut -d' ' -f1)" >> "sha-$f"
              else
                echo "::warning::$f $TAG has no $t bottle: brew builds it from source there"
              fi
            done
            # Leading newlines: end the license line, then a blank line.
            : > "bottle-$f.rb"
            if [ -s "sha-$f" ]; then
              { printf '\n\n  bottle do\n    root_url "%s"\n' "$root"
                cat "sha-$f"; printf '  end\n'; } > "bottle-$f.rb"
            fi
            cat "bottle-$f.rb"
          done

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ventsislav-georgiev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formulas
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          BOTTLE_DCH=$(cat bottle-dch.rb)
          BOTTLE_LITE=$(cat bottle-dch-lite.rb)
          mkdir -p tap/Formula
          cat > tap/Formula/dch.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file is generated by the dch release workflow. DO NOT EDIT.
          class Dch < Formula
            desc "Detachable terminal sessions with a headless agent API"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
            sha256 "${SHA}"
            license "GPL-2.0-or-later"${BOTTLE_DCH}

            # Bottle tags do not encode glibc: build from source below 2.28.
            pour_bottle? do
              on_linux do
                reason "The bottle needs glibc 2.28 or later."
                satisfy { OS::Linux::Glibc.system_version >= Version.new("2.28") }
              end
            end

            conflicts_with "dch-lite", because: "both install a dch binary"

            def install
              system "./configure"
              system "make"
              bin.install "dch"
              man1.install "dch.1"
            end

            test do
              assert_match "detachable terminal session", shell_output("#{bin}/dch -h")
            end
          end
          EOF
          cat > tap/Formula/dch-lite.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file is generated by the dch release workflow. DO NOT EDIT.
          # Lite build: no embedded libghostty-vt terminal mirror.
          # The native agent bridge remains included.
          # --read and --wait --match are unavailable (exit 3).
          class DchLite < Formula
            desc "Detachable terminal session manager (lite: no terminal mirror)"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
            sha256 "${SHA}"
            license "GPL-2.0-or-later"${BOTTLE_LITE}

            # Bottle tags do not encode glibc: build from source below 2.17.
            pour_bottle? do
              on_linux do
                reason "The bottle needs glibc 2.17 or later."
                satisfy { OS::Linux::Glibc.system_version >= Version.new("2.17") }
              end
            end

            conflicts_with "dch", because: "both install a dch binary"

            def install
              system "./configure", "--without-libghostty"
              system "make"
              bin.install "dch"
              man1.install "dch.1"
            end

            test do
              assert_match "detachable terminal session", shell_output("#{bin}/dch -h")
            end
          end
          EOF

      - name: Commit and push
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dch.rb Formula/dch-lite.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "dch $TAG"
            git push
          fi
