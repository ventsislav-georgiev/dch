name: Update Homebrew tap

# Publishes/updates Formula/dch.rb in ventsislav-georgiev/homebrew-tap on every
# release. Requires the HOMEBREW_TAP_TOKEN secret (a PAT with write access to
# the tap repo).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.10)"
        required: true

permissions:
  contents: read

jobs:
  bump-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: ver
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Compute source tarball sha256
        id: sha
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
          curl -fsSL "$url" -o src.tar.gz
          echo "sha256=$(sha256sum src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: ventsislav-georgiev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/dch.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file is generated by the dch release workflow. DO NOT EDIT.
          class Dch < Formula
            desc "Detachable terminal session manager with auto-naming and a TUI picker"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
            sha256 "${SHA}"
            license "GPL-2.0-or-later"

            def install
              system "./configure"
              system "make"
              bin.install "dch"
            end

            test do
              assert_match "detachable terminal session", shell_output("\#{bin}/dch -h")
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dch.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "dch ${{ steps.ver.outputs.tag }}"
            git push
          fi
