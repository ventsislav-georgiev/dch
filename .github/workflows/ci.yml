name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        variant: [full, lite]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: |
          if [ "${{ matrix.variant }}" = "lite" ]; then
            ./configure --without-libghostty
          else
            ./configure
          fi

      - name: Build
        run: make

      - name: Binary size
        run: ls -la dch

      - name: Test
        run: make test

  # Lite client binary driving a session spawned by a full master: the verb
  # client side is protocol-only, so every verb must work cross-build.
  mixed-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build both variants
        run: |
          ./configure --without-libghostty && make && cp dch /tmp/dch-lite
          make clean && ./configure && make
      - name: Lite client vs full master
        run: |
          set -ex
          ./dch --spawn mixed sh
          sleep 0.5
          /tmp/dch-lite --run mixed "echo mixed_marker"
          /tmp/dch-lite --wait mixed --match mixed_marker --timeout 10000
          /tmp/dch-lite --read mixed | grep mixed_marker
          /tmp/dch-lite --keys mixed ctrl+c
          /tmp/dch-lite --ls-json | grep '"name":"mixed"'
          # State detection is client-side over the read protocol: a lite
          # client must detect against a full master's mirror (closest CI
          # proxy for "old master, new client" after an update).
          /tmp/dch-lite --run mixed "printf 'esc to interrupt\n'"
          /tmp/dch-lite --wait mixed --match "esc to interrupt" --timeout 10000
          test "$(/tmp/dch-lite --status mixed)" = working
          ./dch -k mixed

  # The committed libghostty-vt blobs must be honestly derived from the
  # pinned upstream commit. Byte-equality across machines proved brittle
  # (zig embeds host-specific paths despite pinned build/cache dirs), so
  # verify functionally: rebuild the host blob from the pin, check the
  # vendored headers match the pin, and run the full suite linked against
  # the rebuilt blob. Zig is only needed here, never for `make`.
  vendor-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No versioned zig@0.17 formula exists; the script's version gate
      # fails loudly if the zig formula moves past 0.17.x.
      - name: Install zig 0.17
        run: brew install zig

      - name: Rebuild host blob from the pinned commit
        run: ZIG=/opt/homebrew/opt/zig/bin/zig scripts/build-libghostty.sh --refresh-sha

      - name: Vendored headers must match the pin
        run: git diff --exit-code vendor/libghostty-vt/include

      - name: Full suite against the rebuilt blob
        run: ./configure && make && make test

  # ASan + UBSan over the whole suite (scripts/sanitize.sh says why each
  # option is set). Any sanitizer report fails the job.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        variant: [full, lite]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test under ASan + UBSan
        run: |
          if [ "${{ matrix.variant }}" = "lite" ]; then
            scripts/sanitize.sh --without-libghostty
          else
            scripts/sanitize.sh
          fi

  # Our code builds warning-free under a strict set, on gcc and clang. The
  # default `make` stays lenient; XCFLAGS adds to configure's CFLAGS (and
  # its hardening flags) rather than replacing them.
  strict-warnings:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      STRICT: >-
        -Wall -Wextra -Wformat=2 -Wshadow -Wpointer-arith -Wcast-qual
        -Wstrict-prototypes -Wmissing-prototypes -Wundef -Wvla
        -Wnull-dereference -Wimplicit-fallthrough -Werror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Full
        run: ./configure CC=${{ matrix.cc }} && make XCFLAGS="$STRICT"
      - name: Lite
        run: |
          make clean
          ./configure CC=${{ matrix.cc }} --without-libghostty
          make XCFLAGS="$STRICT"

  # clang's static analyzer over every source file, both variants: any
  # finding is an error. A false positive is reshaped away or gets a
  # narrow, commented annotation — never a blanket disable.
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: clang --analyze
        run: |
          rc=0
          for v in full lite; do
            if [ $v = lite ]; then
              ./configure --without-libghostty
              srcs="attach.c master.c dch.c vt_stub.c bridge.c serve.c rframe.c remote.c json.c picker.c"
            else
              ./configure
              srcs="attach.c master.c dch.c vt.c bridge.c serve.c rframe.c remote.c json.c picker.c"
            fi
            for f in $srcs; do
              clang --analyze -Xanalyzer -analyzer-werror -I. \
                -Ivendor/libghostty-vt/include -o /dev/null "$f" || rc=1
            done
          done
          exit $rc

  # The Windows client (#077): dch.exe from MSYS2's mingw-w64 gcc under the
  # strict set, then its checks against fake servers on 127.0.0.1. Native
  # Windows python and gcc (UCRT64); no Cygwin runtime in the binary.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # LF stays LF: the build script runs under MSYS2's sh.
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build dch.exe (strict)
        run: |
          CC=gcc scripts/build-windows.sh -Wextra -Wformat=2 -Wshadow \
            -Wpointer-arith -Wcast-qual -Wstrict-prototypes \
            -Wmissing-prototypes -Wundef -Wvla -Wnull-dereference \
            -Wimplicit-fallthrough -Werror
          ls -la dch.exe
          ./dch.exe --version
      - name: Test
        run: DCH=./dch.exe python tests/windows_client_test.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dch-exe
          path: dch.exe
          if-no-files-found: error
          retention-days: 14

  # libFuzzer targets (tests/fuzz/), 60 s each under ASan + UBSan.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fuzz
        run: CC=clang FUZZ_ARTIFACTS=$PWD/fuzz-artifacts scripts/fuzz.sh 60
