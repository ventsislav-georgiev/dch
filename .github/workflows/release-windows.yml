name: Windows release asset

# Builds dch.exe from a release's tag and attaches it, with dch.exe.sha256,
# to that release. Fires on the same event as homebrew.yml (the release
# exists by then, so no race). Re-runnable: uploads use --clobber.
# workflow_dispatch: with a tag, rebuild and re-attach to that release;
# without one, build the dispatched ref and keep it as a run artifact only.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach to (e.g. v1.35.0); empty = artifact only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dch-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG && format('refs/tags/{0}', env.TAG) || github.ref }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build dch.exe
        run: |
          CC=gcc scripts/build-windows.sh
          ./dch.exe --version
          sha256sum dch.exe > dch.exe.sha256
          cat dch.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dch-exe-release
          path: |
            dch.exe
            dch.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dch.exe dch.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
